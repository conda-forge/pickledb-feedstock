{% set name = "pickleDB" %}
{% set version = "1.6" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: 0a1311e932d92fb66ce6eeb7f6a9af56852dffa2054b6021ba3563402d5219e2

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - pip
    - python
  run:
    - python

test:
  imports:
    - pickledb

about:
  home: http://github.com/patx/pickledb
  license: BSD 3-clause
  license_family: BSD
  # See https://github.com/patx/pickledb/issues/52
  license_file: LICENSE
  summary: A lightweight and simple database using json.

extra:
  recipe-maintainers:
    - xhochy
